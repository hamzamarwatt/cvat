# Podman on Fedora: fully qualified docker.io images + local CVAT build tags.
#
# CVAT is NOT on registry.access.redhat.com or registry.fedoraproject.org.
# Never pick those when prompted — use docker.io or build locally first.
#
# Recommended (build once, then up):
#   export CVAT_HOST=localhost
#   ./scripts/podman-build-cvat.sh
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#     -f docker-compose.podman.yml up -d
#
# Or: same compose files with up -d --build (cvat_server / cvat_ui build from repo).

x-cvat-server-image: &cvat_server_image docker.io/cvat/server:dev
x-cvat-ui-image: &cvat_ui_image docker.io/cvat/ui:dev

services:
  cvat_db:
    image: docker.io/library/postgres:15-alpine

  cvat_redis_inmem:
    image: docker.io/library/redis:7.2.11-alpine

  cvat_redis_ondisk:
    image: docker.io/apache/kvrocks:2.15.0

  traefik:
    image: docker.io/library/traefik:v3.6
    volumes:
      - /run/podman/podman.sock:/var/run/docker.sock:ro
      - ./components/analytics/grafana_conf.yml:/etc/traefik/rules/grafana_conf.yml:ro

  cvat_opa:
    image: docker.io/openpolicyagent/opa:1.12.2

  cvat_clickhouse:
    image: docker.io/clickhouse/clickhouse-server:23.11-alpine

  cvat_vector:
    image: docker.io/timberio/vector:0.26.0-alpine

  cvat_grafana:
    image: docker.io/grafana/grafana-oss:10.1.2

  cvat_server:
    image: *cvat_server_image
    pull_policy: never

  cvat_worker_export:
    image: *cvat_server_image
    pull_policy: never

  cvat_worker_import:
    image: *cvat_server_image
    pull_policy: never

  cvat_worker_quality_reports:
    image: *cvat_server_image
    pull_policy: never

  cvat_worker_consensus:
    image: *cvat_server_image
    pull_policy: never

  cvat_worker_annotation:
    image: *cvat_server_image
    pull_policy: never

  cvat_worker_chunks:
    image: *cvat_server_image
    pull_policy: never

  cvat_worker_webhooks:
    image: *cvat_server_image
    pull_policy: never

  cvat_worker_utils:
    image: *cvat_server_image
    pull_policy: never

  cvat_ui:
    image: *cvat_ui_image
    pull_policy: never
